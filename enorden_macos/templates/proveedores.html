{% extends "base.html" %}

{% block title %}Proveedores - {{ nombre_tienda }}{% endblock %}

{% block content %}
<div class="section">
    <div class="section-header">
        <h2 class="section-title">
            <span class="section-title-icon">🏭</span>
            Proveedores
        </h2>
        <button class="btn btn-primary btn-sm" onclick="Modal.open('modal-nuevo-proveedor')">
            + Nuevo Proveedor
        </button>
    </div>

    <!-- Búsqueda -->
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-proveedores" class="search-input" placeholder="Buscar proveedor por nombre o teléfono...">
    </div>

    <!-- Lista de proveedores -->
    <div id="proveedores-list">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 1rem;">Cargando proveedores...</p>
        </div>
    </div>
</div>

<!-- Modal Nuevo Proveedor -->
<div id="modal-nuevo-proveedor" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Nuevo Proveedor</h3>
            <button class="modal-close" onclick="Modal.close('modal-nuevo-proveedor')">✕</button>
        </div>
        <form onsubmit="event.preventDefault(); crearNuevoProveedor(this);">
            <div class="form-group">
                <label class="form-label">Nombre *</label>
                <input type="text" name="nombre" class="form-input" placeholder="Nombre del proveedor" required>
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" name="telefono" class="form-input" placeholder="Número de teléfono">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="Modal.close('modal-nuevo-proveedor')" style="flex: 1;">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    Crear Proveedor
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    // Inicializar página de proveedores
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof Proveedores !== 'undefined') {
            Proveedores.init();
        }
    });
</script>
{% endblock %}
