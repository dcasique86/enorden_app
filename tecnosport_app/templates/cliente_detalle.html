{% extends "base.html" %}

{% block title %}{{ nombre_tienda }} - Detalle de Cliente{% endblock %}

{% block context_nav %}
<!-- Back button -->
<a href="/clientes" class="btn btn-ghost" style="display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
    ← Volver a Clientes
</a>
{% endblock %}

{% block content %}
<div id="cliente-content" class="page-view" style="padding-top:0.5rem;">
    <div class="loading" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div class="spinner"></div>
        <p style="margin-top: 1rem;">Cargando información del cliente...</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.body.dataset.page = 'cliente-detalle';
    // Obtener ID del cliente de la URL
    const pathParts = window.location.pathname.split('/');
    const clienteId = pathParts[pathParts.length - 1];
    document.body.dataset.clienteId = clienteId;
</script>
{% endblock %}
