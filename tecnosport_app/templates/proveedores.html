{% extends "base.html" %}

{% block title %}Proveedores - {{ nombre_tienda }}{% endblock %}

{% block content %}
<div class="page-view">
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;padding:0.75rem 0;flex-shrink:0;">
        <h2 class="section-title" style="margin:0;">
            <span class="section-title-icon">🏭</span>
            Proveedores
        </h2>
        <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-secondary btn-sm" onclick="Modal.open('modal-nueva-devolucion-proveedor')">
                ↩️ Nueva Devolución
            </button>
            <button class="btn btn-primary btn-sm" onclick="Modal.open('modal-nuevo-proveedor')">
                + Nuevo Proveedor
            </button>
        </div>
    </div>

    <div style="display:flex;gap:0.5rem;flex-shrink:0;margin-bottom:0.5rem;">
        <div class="search-box" style="flex:1;margin-bottom:0;">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-proveedores" class="search-input" placeholder="Buscar proveedor por nombre o teléfono...">
        </div>
        <select id="orden-proveedores" class="form-input" style="width:auto;flex-shrink:0;" onchange="Proveedores.setOrden(this.value); Proveedores.loadProveedores();">
            <option value="saldo_desc">Mayor saldo</option>
            <option value="saldo_asc">Menor saldo</option>
            <option value="nombre_asc">A - Z</option>
            <option value="nombre_desc">Z - A</option>
        </select>
    </div>

    <div id="proveedores-list" class="scrollable-area">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 1rem;">Cargando proveedores...</p>
        </div>
    </div>
</div>

<!-- Modal Nuevo Proveedor -->
<div id="modal-nuevo-proveedor" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Nuevo Proveedor</h3>
            <button class="modal-close" onclick="Modal.close('modal-nuevo-proveedor')">✕</button>
        </div>
        <form onsubmit="event.preventDefault(); crearNuevoProveedor(this);">
            <div class="form-group">
                <label class="form-label">Nombre *</label>
                <input type="text" name="nombre" class="form-input" placeholder="Nombre del proveedor" required>
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" name="telefono" class="form-input" placeholder="Número de teléfono">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="Modal.close('modal-nuevo-proveedor')" style="flex: 1;">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    Crear Proveedor
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar Proveedor -->
<div id="modal-editar-proveedor" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">✏️ Editar Proveedor</h3>
            <button class="modal-close" onclick="Modal.close('modal-editar-proveedor')">✕</button>
        </div>
        <form onsubmit="event.preventDefault(); guardarProveedorEdicion(this);">
            <input type="hidden" name="editar_proveedor_id" id="editar-proveedor-id">
            <div class="form-group">
                <label class="form-label">Nombre *</label>
                <input type="text" name="editar_proveedor_nombre" id="editar-proveedor-nombre" class="form-input" placeholder="Nombre del proveedor" required>
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" name="editar_proveedor_telefono" id="editar-proveedor-telefono" class="form-input" placeholder="Número de teléfono">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="Modal.close('modal-editar-proveedor')" style="flex: 1;">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    (function() {
        const devSearch = document.getElementById('buscar-proveedor-devolucion');
        const devResults = document.getElementById('resultados-busqueda-devolucion');
        const devSelected = document.getElementById('proveedor-seleccionado-devolucion');
        const devProveedorId = document.getElementById('devolucion-proveedor-id');

        if (devSearch && devResults && !devSearch._listenerAttached) {
            devSearch._listenerAttached = true;
            let searchTimeout;
            devSearch.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                const q = devSearch.value.trim();
                if (q.length < 1) { devResults.classList.remove('active'); return; }
                searchTimeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`/api/proveedores/buscar?q=${encodeURIComponent(q)}`);
                        const json = await res.json();
                        const provedores = json.data || [];
                        if (provedores.length === 0) {
                            devResults.innerHTML = '<div class="search-result-item"><span class="text-muted">Sin resultados</span></div>';
                        } else {
                            devResults.innerHTML = provedores.map(p => `
                                <div class="search-result-item" data-id="${p.id}" data-nombre="${p.nombre}" data-telefono="${p.telefono || ''}">
                                    <div class="cliente-info">
                                        <div class="cliente-avatar">${(p.nombre||'?')[0]}</div>
                                        <div>
                                            <div class="cliente-nombre">${p.nombre}</div>
                                            <div class="cliente-deuda">${p.telefono || ''}</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('');
                            devResults.querySelectorAll('.search-result-item').forEach(el => {
                                el.addEventListener('click', () => {
                                    devProveedorId.value = el.dataset.id;
                                    devSearch.style.display = 'none';
                                    devResults.classList.remove('active');
                                    devSelected.innerHTML = `
                                        <div class="cliente-item" style="cursor: default; border-color: var(--success);">
                                            <div class="cliente-info">
                                                <div class="cliente-avatar">${(el.dataset.nombre||'?')[0]}</div>
                                                <div>
                                                    <div class="cliente-nombre">${el.dataset.nombre}</div>
                                                    <div class="cliente-deuda">${el.dataset.telefono || ''}</div>
                                                </div>
                                            </div>
                                            <button type="button" class="btn btn-ghost" onclick="clearProveedorDevolucion()">✕</button>
                                        </div>
                                    `;
                                    devSelected.style.display = 'block';
                                });
                            });
                        }
                        devResults.classList.add('active');
                    } catch (e) { console.error('Error buscando proveedor:', e); }
                }, 300);
            });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-box')) devResults.classList.remove('active');
            });
        }
    })();

    function clearProveedorDevolucion() {
        const search = document.getElementById('buscar-proveedor-devolucion');
        const selected = document.getElementById('proveedor-seleccionado-devolucion');
        const idInput = document.getElementById('devolucion-proveedor-id');
        if (search) { search.style.display = 'block'; search.value = ''; search.focus(); }
        if (selected) selected.style.display = 'none';
        if (idInput) idInput.value = '';
    }
</script>

<!-- Modal Nueva Devolución Proveedor -->
<div id="modal-nueva-devolucion-proveedor" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">
                <span style="color: var(--warning);">↩️</span>
                Nueva Devolución a Proveedor
            </h3>
            <button class="modal-close" onclick="Modal.close('modal-nueva-devolucion-proveedor')">✕</button>
        </div>
        <form onsubmit="event.preventDefault(); crearDevolucionProveedor(this);" id="form-devolucion-proveedor">
            <input type="hidden" name="proveedor_id" id="devolucion-proveedor-id">
            
            <div class="form-group">
                <label class="form-label">Proveedor *</label>
                <div class="search-box" style="margin-bottom: 0;">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="buscar-proveedor-devolucion" class="search-input" placeholder="Buscar proveedor..." autocomplete="off">
                    <div id="resultados-busqueda-devolucion" class="search-results"></div>
                </div>
                <div id="proveedor-seleccionado-devolucion" style="display: none; margin-top: 0.75rem;"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Descripción *</label>
                <textarea name="descripcion" class="form-input" placeholder="Descripción de la devolución (ej: devolución de 5 camisetas Nike talla L)" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Monto *</label>
                <input type="text" name="monto" id="devolucion-monto" inputmode="decimal" class="form-input" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label class="form-label">Observaciones</label>
                <textarea name="observaciones" class="form-input" placeholder="Observaciones adicionales..." rows="2"></textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="Modal.close('modal-nueva-devolucion-proveedor')" style="flex: 1;">
                    Cancelar
                </button>
                <button type="submit" class="btn btn-warning" style="flex: 1;">
                    ↩️ Registrar Devolución
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
